[project]
name = "arda"
version = "0.1.0"
description = "Multi-agent system: Sauron orchestrator, Earendil executor, Finrod retriever, Tom Bombadil specialist."
authors = [{ name = "Solomon Smith" }]
requires-python = ">=3.12"

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",

    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # Infra clients
    "redis[hiredis]>=5.0",
    "pymilvus>=2.4",

    # LLM frameworks
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.2",
    "langgraph>=0.2",

    # Embeddings (local, free)
    "sentence-transformers>=3.0",

    # MCP
    "mcp[cli]>=1.0",

    # Discord (Tom Bombadil)
    "discord.py>=2.4",

    # HTTP
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis>=2.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "api", "mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "phase4: deferred to Phase 4 (needs real Redis / Discord / Milvus fixtures)",
    "integration: requires live external services (Redis, Milvus, Discord, TMDB)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]
