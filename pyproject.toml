[project]
name = "arda"
version = "0.3.0"
description = "Multi-agent system: Sauron orchestrator, Earendil executor, Finrod retriever, Tom Bombadil specialist."
authors = [{ name = "Solomon Smith" }]
requires-python = ">=3.12"

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",

    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # Infra clients
    "redis[hiredis]>=5.0",

    # LLM frameworks. Anthropic SDK is the canonical provider for
    # Sauron (Opus, orchestrator), Finrod (Haiku, retriever), and
    # Tom Bombadil (Haiku, specialist). LangChain is gone from this
    # repo's direct deps; langgraph still pulls langchain-core in
    # transitively for its own type system.
    "anthropic>=0.40",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",

    # RAG (Finrod). HuggingFace embedding integration is heavy
    # (pulls torch + transformers); it lives in the `[full]` extra
    # alongside sentence-transformers. The slim default uses
    # LlamaIndex's MockEmbedding (in core).
    "llama-index-core>=0.14",
    "llama-index-llms-anthropic>=0.11",

    # NumPy is pulled in transitively by llama-index-core. NumPy 2.x ships
    # wheels built for the x86-64-v2 baseline, which the deploy host cannot
    # execute: its CPU is an Intel Core 2 Duo P8600 (2008 Penryn) with no
    # popcnt and no sse4_2. Importing numpy 2.x there raises
    #   RuntimeError: NumPy was built with baseline optimizations:
    #   (X86_V2) but your machine doesn't support: (X86_V2).
    # which killed the API lifespan on every start. 1.26.x is the last
    # series built against the plain x86-64 baseline and still has cp312
    # wheels. Revisit if the deploy host is ever replaced.
    "numpy<2",

    # MCP
    "mcp[cli]>=1.0",

    # Discord (Tom Bombadil)
    "discord.py>=2.4",

    # HTTP
    "httpx>=0.27",

    # Cron scheduling (Galadriel)
    "croniter>=2.0",

    # RSS parsing (Tom Bombadil Letterboxd auto-sync)
    "feedparser>=6.0",

    # YAML config (Tom Bombadil identity map)
    "pyyaml>=6.0",

    # Prometheus counters (Tom Bombadil PR 6 metrics).
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "fakeredis>=2.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Real semantic embeddings + Milvus vector store. Skipped in the slim
# default install (Finrod uses LlamaIndex MockEmbedding + SimpleVectorStore).
# Add `[full]` when you want sentence-transformers (~1GB torch) and the
# LlamaIndex Milvus integration.
full = [
    "sentence-transformers>=3.0",
    "pymilvus>=2.4",
    "llama-index-embeddings-huggingface>=0.7",
    "llama-index-vector-stores-milvus>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "agents", "api", "mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "phase4: deferred to Phase 4 (needs real Redis / Discord / Milvus fixtures)",
    "integration: requires live external services (Redis, Milvus, Discord, TMDB)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["earendil", "tombombadil", "earendil-mcp"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"

# Third-party packages that ship no type information. Not our debt and not
# fixable here: feedparser, croniter and PyYAML have no py.typed marker, and
# pymilvus / the llama-index Milvus + HuggingFace integrations live behind the
# [full] extra, so they are absent from the slim default install by design
# (CLAUDE.md documents the pymilvus note as expected). Silencing them keeps
# `mypy agents core` output to real findings in our own code.
[[tool.mypy.overrides]]
module = [
    "croniter.*",
    "feedparser.*",
    "llama_index.embeddings.huggingface.*",
    "llama_index.vector_stores.milvus.*",
    "pymilvus.*",
    "yaml.*",
]
ignore_missing_imports = true
