# Compose override for the public demo. Use with the base file, from the repo root:
#   docker compose -p arda-demo -f docker-compose.yml -f deploy/demo/docker-compose.demo.yml up -d --build api
# Requires Docker Compose 2.24+ (for !reset / !override).
# Paths below resolve against the first -f file's directory, the repo root.
name: arda-demo

services:
  api:
    image: arda-demo:latest
    # The demo checkout has no project .env, so the base interpolation of
    # ARDA_EXTRAS is empty. Pin the extra here so the image can import
    # HuggingFaceEmbedding.
    build:
      args:
        ARDA_EXTRAS: embeddings
    # Loopback only: cloudflared is the one thing that may reach the app.
    # 5001 so it never collides with a production ARDA on 5000.
    ports: !override
      - "127.0.0.1:5001:5000"
    env_file: !override
      - .env.demo
    environment: !override
      DEMO_MODE: "true"
      # The root filesystem is read-only, so the model download cannot use
      # the default cache under /root. Both paths sit on hf_cache.
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/huggingface/torch
    depends_on: !reset []
    volumes: !override
      - hf_cache:/cache/huggingface
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Cap for torch and MiniLM in this process.
    mem_limit: 2g
    pids_limit: 200

  # No executor, no queue, no scheduler in the demo. They never start.
  worker:
    profiles: ["off"]
  redis:
    profiles: ["off"]

volumes:
  hf_cache:
