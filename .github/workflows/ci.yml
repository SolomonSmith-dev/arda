name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Slim install: no [full] extra, so CI stays fast (Finrod uses
      # MockEmbedder + InMemoryStore; pymilvus / sentence-transformers
      # are exercised only behind the optional [full] extra).
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check .

      # agents + core only. The tests/ tree is deliberately excluded: test
      # doubles fake third-party shapes on purpose and typing them adds noise
      # without catching bugs. This runs on the same slim install as
      # everything else, which the [tool.mypy] overrides in pyproject.toml
      # account for (pymilvus and the llama-index extras are [full]-only).
      - name: Mypy
        run: uv run mypy agents core

      - name: Pytest
        run: uv run pytest tests/ -q
