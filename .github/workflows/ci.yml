name: CI

on:
  push:
    branches: [main]
  pull_request:

# Copy, never hardlink, from the uv cache: the pathsec guard refuses multiply-linked
# files, and llama_index's bundled NLTK stopwords are read at ingest time.
env:
  UV_LINK_MODE: copy

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # Slim install: no [full] extra, so CI stays fast (Finrod uses
      # MockEmbedder + InMemoryStore; pymilvus / sentence-transformers
      # are exercised only behind the optional [full] extra).
      - name: Install dependencies
        run: uv sync --extra dev

      # One gate: the same script every agent runs before it says done.
      # Steps: ruff, mypy (agents + core), pytest, mock evals, README results check.
      - name: Gate
        run: scripts/check.sh
