services:
  redis:
    image: redis:7-alpine
    # Host already runs redis-server on 6379 (legacy Earendil queue).
    # Publish the new compose-internal Redis on 6380 to avoid collision.
    # API + worker still talk to it as redis:6379 over the compose network.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    image: arda:0.3.0
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    image: arda:0.3.0
    command: ["python", "-m", "agents.earendil.worker"]
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  # Tom Bombadil Discord bot. Disabled by `profile: discord` so a plain
  # `docker compose up -d` doesn't try to start it without a token. To
  # enable: set DISCORD_TOKEN in .env, then `docker compose --profile
  # discord up -d` (or `docker compose up -d tombombadil`).
  tombombadil:
    profiles: ["discord"]
    image: arda:0.3.0
    command: ["python", "-m", "agents.tombombadil.bot"]
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Real Milvus (etcd + minio + standalone) deferred to v0.4 per plan.
  # Finrod uses the in-memory store fallback when MILVUS_HOST is unreachable.
